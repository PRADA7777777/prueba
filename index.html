<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petfy - Perfil de Perro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #fdf8f3 0%, #fff4ec 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 100%;
            overflow: hidden;
            border: 1px solid #f0e6dd;
            position: relative;
        }
        .card-header {
            background: linear-gradient(135deg, #e0633f 0%, #c2410c 100%);
            height: 160px;
            position: relative;
        }
        .card-header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            mix-blend-mode: luminosity;
            opacity: 0.4;
        }
        .dog-avatar {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            background: #fdf8f3;
            z-index: 2;
        }
        .dog-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            mix-blend-mode: normal;
            opacity: 1;
        }
        .card-body {
            padding: 3.5rem 1.5rem 1.5rem;
            text-align: center;
        }
        .dog-name {
            font-family: 'Fredoka One', cursive;
            font-size: 1.8rem;
            color: #064f56;
            margin-bottom: 0.25rem;
        }
        .dog-breed {
            font-size: 0.9rem;
            color: #9ca3af;
            font-weight: 600;
            margin-bottom: 1rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .dog-info {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fdf8f3;
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            border: 1px solid #f0e6dd;
            min-width: 80px;
        }
        .info-item .icon {
            font-size: 1.2rem;
            margin-bottom: 0.2rem;
        }
        .info-item .value {
            font-weight: 700;
            color: #064f56;
            font-size: 0.95rem;
        }
        .info-item .label {
            font-size: 0.65rem;
            color: #9ca3af;
            text-transform: uppercase;
            font-weight: 700;
        }
        .owner-section {
            background: #fff7ed;
            border-radius: 16px;
            padding: 1rem;
            border: 1px solid #fed7aa;
            margin-bottom: 1rem;
        }
        .owner-title {
            font-size: 0.75rem;
            color: #c2410c;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        .owner-name {
            font-weight: 700;
            color: #064f56;
            font-size: 1.1rem;
        }
        .contact-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #064f56 0%, #0a6b74 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(6, 79, 86, 0.25);
        }
        .contact-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(6, 79, 86, 0.35);
        }
        .contact-btn .icon {
            font-size: 1.2rem;
        }
        .card-footer {
            padding: 0 1.5rem 1.5rem;
            text-align: center;
            font-size: 0.7rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <!-- Imagen de fondo del header -->
            <img src="foto1.jpg" alt="Fondo perro">
            
            <!-- Avatar del perro -->
            <div class="dog-avatar">
                <img src="foto1.jpg" alt="Foto del perro">
            </div>
        </div>

        <div class="card-body">
            <h1 class="dog-name">Firulais</h1>
            <p class="dog-breed">Golden Retriever</p>

            <div class="dog-info">
                <div class="info-item">
                    <span class="icon">⚖️</span>
                    <span class="value">25 kg</span>
                    <span class="label">Peso</span>
                </div>
                <div class="info-item">
                    <span class="icon">🎂</span>
                    <span class="value">3 años</span>
                    <span class="label">Edad</span>
                </div>
                <div class="info-item">
                    <span class="icon">🐕</span>
                    <span class="value">Juguetón</span>
                    <span class="label">Actitud</span>
                </div>
            </div>

            <div class="owner-section">
                <div class="owner-title">Dueño Responsable</div>
                <div class="owner-name">Oscar Prada</div>
            </div>

            <!-- Botón de contacto con el número de prueba -->
            <a href="tel:3204829244" class="contact-btn">
                <span class="icon">📞</span>
                Llamar al 320 482 9244
            </a>
        </div>

        <div class="card-footer">
            Protegido por Petfy NFC 🐾
        </div>
    </div>

</body>
</html>
