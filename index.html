<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Público - Petfy</title>
    <style>
        /* Importar fuente moderna */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');

        :root {
            --teal: #064f56;
            --orange: #e0633f;
            --bg-color: #f3f4f6;
            --text-dark: #1f2937;
            --text-light: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
        }

        /* Cabecera con la foto */
        .card-header {
            position: relative;
            width: 100%;
            height: 320px;
            background-color: var(--teal);
        }

        .card-header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.95);
            color: var(--teal);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.8rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
        }

        .badge::before {
            content: "✓";
            color: #15803d;
        }

        /* Contenido */
        .card-content {
            padding: 24px;
            margin-top: -20px;
            position: relative;
            background: #fff;
            border-radius: 24px 24px 0 0;
        }

        .pet-name {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--teal);
            margin-bottom: 4px;
            text-align: center;
        }

        .pet-info {
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* Caja de mensaje urgente */
        .alert-box {
            background-color: #fff7ed;
            border: 2px dashed var(--orange);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-bottom: 24px;
            animation: pulse-border 2s infinite;
        }

        .alert-box p {
            color: #9a3412;
            font-weight: 700;
            font-size: 1.1rem;
            margin: 0;
        }

        .alert-box span {
            display: block;
            font-size: 0.85rem;
            color: #c2410c;
            font-weight: 600;
            margin-top: 4px;
        }

        @keyframes pulse-border {
            0% { border-color: var(--orange); }
            50% { border-color: #fed7aa; }
            100% { border-color: var(--orange); }
        }

        /* Botón de contacto */
        .contact-text {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-dark);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .btn-call {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, var(--teal) 0%, #0a6b74 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 800;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(6, 79, 86, 0.25);
        }

        .btn-call:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(6, 79, 86, 0.35);
        }

        .btn-call:active {
            transform: translateY(0);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
            color: var(--text-light);
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .footer img {
            height: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- FOTO DEL PERRO -->
        <div class="card-header">
            <!-- Asegúrate de que la imagen se llame foto1.jpg y esté en la misma carpeta -->
            <img src="Copia de image00035.jpeg" alt="Foto de la mascota" onerror="this.src='https://placedog.net/500/500?id=10'">
            <div class="badge">Perfil Verificado</div>
        </div>

        <!-- INFORMACIÓN -->
        <div class="card-content">
            <h1 class="pet-name">Tobias</h1>
            <p class="pet-info">Labrador • Macho • 5 años</p>

            <!-- MENSAJE ESPECIAL -->
            <div class="alert-box">
                <p>¡Hola! Si me encontraste,</p>
                <span>Por favor, ENTREGAR A MI FAMILIA</span>
            </div>

            <!-- CONTACTO -->
            <p class="contact-text">Comunícate con mi dueño:</p>
            <a href="tel:3204829244" class="btn-call">
                📞 Llamar al 320 482 9244
            </a>

            <!-- FOOTER -->
            <div class="footer">
                <span>Protegido por Petfy NFC</span>
                <span>petfy.com</span>
            </div>
        </div>
    </div>

</body>
</html>
