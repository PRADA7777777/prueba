<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encontré a esta mascota - Petfy</title>
    <!-- Fuente amigable de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0EA5E9; /* Azul bonito */
            --whatsapp: #25D366; /* Verde WhatsApp */
            --bg: #F3F4F6;
            --text-dark: #1F2937;
            --text-light: #6B7280;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 400px;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        /* Cinta superior de alerta */
        .alert-banner {
            background-color: #FEF2F2;
            color: #DC2626;
            text-align: center;
            padding: 12px;
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #FECACA;
        }

        .image-container {
            width: 100%;
            height: 260px;
            background-color: #E5E7EB;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Etiqueta flotante sobre la foto */
        .tag {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3);
            white-space: nowrap;
        }

        .content {
            padding: 30px 24px 24px;
            text-align: center;
        }

        .content h1 {
            font-size: 1.5rem;
            color: var(--text-dark);
            margin: 0 0 10px;
            font-weight: 800;
            line-height: 1.2;
        }

        .content p {
            color: var(--text-light);
            font-size: 1rem;
            margin: 0 0 24px;
            line-height: 1.5;
        }

        .highlight {
            color: var(--text-dark);
            font-weight: 700;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Botón de WhatsApp */
        .btn-whatsapp {
            background-color: var(--whatsapp);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
        }
        .btn-whatsapp:hover {
            background-color: #1EBE57;
        }

        /* Botón de Llamada */
        .btn-phone {
            background-color: white;
            color: var(--text-dark);
            border: 2px solid #E5E7EB;
        }
        .btn-phone:hover {
            background-color: #F9FAFB;
            border-color: #D1D5DB;
        }

        .btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Pie de página Petfy */
        .footer {
            text-align: center;
            padding: 16px;
            background-color: #F9FAFB;
            border-top: 1px solid #F3F4F6;
            color: #9CA3AF;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .footer span {
            color: var(--primary);
        }

        /* Efecto de carga para el botón de ubicación */
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="alert-banner">
            🚨 MASCOTA ENCONTRADA
        </div>
        
        <div class="image-container">
            <!-- Asegúrate de que la foto se llame exactamente foto1.jpg en la misma carpeta -->
            <img src="foto1.jpg" alt="Foto de la mascota" onerror="this.src='https://via.placeholder.com/400x260?text=Foto+de+la+Mascota'">
            <div class="tag">¡Ayúdame a volver!</div>
        </div>

        <div class="content">
            <h1>¿Me encontraste?</h1>
            <p>Por favor, <span class="highlight">entrégame a mi familia</span>. Ellos están muy preocupados por mí. ¡Gracias por tu ayuda!</p>

            <div class="btn-group">
                <!-- Botón de WhatsApp con envío de ubicación -->
                <button class="btn btn-whatsapp" onclick="enviarWhatsApp(this)">
                    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                    <span>Enviar Ubicación por WhatsApp</span>
                </button>

                <!-- Botón de Llamada -->
                <button class="btn btn-phone" onclick="llamarDueno()">
                    <svg viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.03 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
                    <span>Llamar al Dueño</span>
                </button>
            </div>
        </div>
        
        <div class="footer">
            Protegido por <span>Petfy</span> - Placa NFC
        </div>
    </div>

    <script>
        // Número de teléfono del dueño (con código de país para Colombia: 57)
        const TELEFONO_DUENO = "573204829244"; 

        // Lógica del botón de Llamada
        function llamarDueno() {
            window.location.href = `tel:+${TELEFONO_DUENO}`;
        }

        // Lógica del botón de WhatsApp con Ubicación
        function enviarWhatsApp(boton) {
            const mensajeBase = "¡Hola! Encontré a tu mascota 🐶. Por favor, entrégame a mi familia. ";
            
            // Guardamos el texto original y mostramos estado de carga
            const textoOriginal = boton.innerHTML;
            boton.innerHTML = '<span>Obteniendo ubicación...</span>';
            boton.classList.add('loading');

            // Intentar obtener la ubicación del GPS del celular
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    // Si el usuario acepta dar la ubicación
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const linkMapa = `https://www.google.com/maps?q=${lat},${lon}`;
                        
                        const mensajeFinal = encodeURIComponent(
                            mensajeBase + "\n📍 Mi ubicación exacta es: " + linkMapa
                        );
                        
                        // Abrir WhatsApp
                        window.open(`https://wa.me/${TELEFONO_DUENO}?text=${mensajeFinal}`, '_blank');
                        
                        // Restaurar botón
                        boton.innerHTML = textoOriginal;
                        boton.classList.remove('loading');
                    },
                    // Si el usuario niega la ubicación o hay un error
                    function(error) {
                        const mensajeFinal = encodeURIComponent(
                            mensajeBase + "\n(No pude obtener la ubicación automática, por favor escríbeme para coordinar la entrega)."
                        );
                        window.open(`https://wa.me/${TELEFONO_DUENO}?text=${mensajeFinal}`, '_blank');
                        
                        boton.innerHTML = textoOriginal;
                        boton.classList.remove('loading');
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            } else {
                // Si el navegador no soporta geolocalización
                const mensajeFinal = encodeURIComponent(mensajeBase);
                window.open(`https://wa.me/${TELEFONO_DUENO}?text=${mensajeFinal}`, '_blank');
                boton.innerHTML = textoOriginal;
                boton.classList.remove('loading');
            }
        }
    </script>
</body>
</html>
